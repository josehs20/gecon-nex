version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-hom
    container_name: gecon-nex-hom
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html # mantém código sincronizado com host
      - ./.env-hom:/var/www/html/.env
    environment:
      APP_ENV: staging
      APP_DEBUG: "true"
      APP_KEY: base64:d1ttqOkOWY7oou/sqptbl4+3/QdUL1bnOXjk8vBJlBk=
      DB_HOST: db
      DB_DATABASE: gecon
      DB_USERNAME: root
      DB_PASSWORD: 123456
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_gecon_hom
    ports:
      - "3309:3306" # permite acessar MySQL de fora para testes
    environment:
      MYSQL_DATABASE: gecon
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
